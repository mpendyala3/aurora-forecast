      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="82%" r="55%">
      <stop offset="0" stop-color="#4dffa6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4dffa6" stop-opacity="0"/>
